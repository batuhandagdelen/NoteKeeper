    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteKeeper</title>
    <!-- * Css Connection -->
    <link rel="stylesheet" href="style.css" />
    <!-- *Box icons Connection -->

    <link
      href="https://cdn.boxicons.com/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- * Wrapper -->
    <section class="wrapper">
      <!-- Add Box -->
      <div class="add-box">
        <div class="icon">
          <i class="bx bx-plus"></i>
        </div>
        <p>Add New Note</p>
      </div>

      <!-- Note item -->

        <div class="details">

        </div>

          <div class="settings">
            <i class="bx bx-dots-horizontal-rounded"></i>
            <ul class="menü">

              <li class="delete-icon"><i class="bx bx-trash"></i> Delete</li>

        </div>
      </div> -->
    </section>

    <!-- * Popup -->

    <div class="popup-box">
      <div class="popup">
        <header>
          <h1 id="popup-title">New Note</h1>
          <i class="bx bx-x"></i>
        </header>

        <form>
          <div class="fields">
            <label for="title">Title</label>
            <input type="text" id="title" />
          </div>
          <div class="fields">
            <label for="descrition">Description</label>
            <textarea id="descrition"></textarea>
          </div>
          <button id="form-btn">Add</button>
        </form>
      </div>
    </div>

    <!--* Js Connection -->
    <script src="js/main.js"></script>
